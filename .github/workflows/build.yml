name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VoiceChanger.sln

      - name: Build
        run: dotnet build VoiceChanger.sln -c Release --no-restore

      - name: Test
        run: dotnet test VoiceChanger.sln -c Release --no-build

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: artifacts/screenshots
          if-no-files-found: ignore

  publish:
    name: Publish Windows app
    needs: test
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained single file
        run: >
          dotnet publish src/VoiceChanger.App/VoiceChanger.App.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -o publish

      - name: Upload VoiceChanger.exe
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger-win-x64
          path: publish/VoiceChanger.exe
          if-no-files-found: error
